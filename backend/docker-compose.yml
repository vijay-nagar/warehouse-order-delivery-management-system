services:
  backend-1:
    build: .
    container_name: warehouse-backend-1
    environment:
      NODE_ENV: development
      PORT: 3000
      INSTANCE_NAME: backend-1
      DB_SERVER: host.docker.internal
      DB_PORT: 1434
      DB_DATABASE: WarehouseOrderDelivery
      DB_USER: sa
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: 1h
    ports:
      - "3001:3000"

  backend-2:
    build: .
